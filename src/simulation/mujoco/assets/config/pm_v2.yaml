actuator:
  joint_command_topic: /hardware/joint_command
  joint_state_topic: /hardware/joint_state
collision_model:
  use_simplified_geometry: true  # true=使用简化几何体(快), false=使用真实mesh(精确)
contact_visualization:
  enabled: true
  force_scale: 0.01
  marker_size: 0.1
  position_offset: 0.0
model_param:
  num_contacts: 4
  num_single_contact_dimensions: 2
  num_total_joints: 24
sensor:
  imu_topic: /hardware/imu_info
urdf: serial_pm_v2.urdf
xml: pm_v2.xml
