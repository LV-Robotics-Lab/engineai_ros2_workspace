# 观测配置
observations:
  num_single_observations: 78
  
  # 各观测类型的配置
  observation_type:
    # mimic_future 类型配置
    mimic_future:
      goal_length: 480  # current(24*2=48) + future_9_frames(9*24*2=432) = 480
      goal_history_steps: 1  # 不需要goal历史
      num_include_obs_steps: 5  # 本体感知历史步数，与Python的history_length=5一致
      goal_scale: 1.0
    
    # 保留原有的mimic类型配置（向后兼容）
    mimic:
      goal_length: 24
      goal_history_steps: 1
      num_include_obs_steps: 5
      goal_scale: 1.0
    
    # 其他观测类型...
    rl_locomotion:
      goal_length: 5
      goal_history_steps: 1
      num_include_obs_steps: 5
      goal_scale: 1.0

  # 观测scale配置
  observation_scale:
    observation_scale_linear_vel: 1.0  # 未在 policy 观测中使用
    observation_scale_angular_vel: 1.0  # base_ang_vel scale = 1.0
    observation_scale_dof_pos: 1.0  # joint_pos scale = 1.0
    observation_scale_dof_vel: 0.05  # joint_vel scale = 0.05 (实际是 1/20)
    observation_scale_quat: 1.0  # projected_gravity scale = 1.0
    observation_scale_actions: 1.0  # actions scale = 1.0
    observation_scale_command: 1.0  # command 不缩放
    observation_scale_future_frames: 1.0  # future_frames 不缩放

