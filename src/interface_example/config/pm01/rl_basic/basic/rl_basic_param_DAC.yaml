# flat tracking mimic policy 是单帧输入
num_observations: 129
num_include_obs_steps: 1

# 观测配置
observations:
  num_single_observations: 129
  
  # 各观测类型的配置
  observation_type:
    mimic_flat:
      num_include_obs_steps: 1

  # 观测scale配置
  observation_scale:
    observation_scale_linear_vel: 1.0
    observation_scale_angular_vel: 1.0
    observation_scale_dof_pos: 1.0
    observation_scale_dof_vel: 1.0
    observation_scale_quat: 1.0

