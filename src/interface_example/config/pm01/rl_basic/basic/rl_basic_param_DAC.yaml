observation_clip: 20000.0
# transition 内 q_des 从 initial_joint_q_ 过渡到策略输出；MuJoCo reset / 重进 joint_bridge 时节点会按当前 q_real_ 重采 initial_joint_q_
transition_time: 0.01

# IMU 和线速度偏置参数
imu_install_delta_bias: 0.0
linear_vel_delta_bias: 0.0

# 命令处理参数
remote_command_sampling_frequency: 50.0
remote_command_cut_off_frequency: 5.0
enable_remote_command_lpf: true
command_scale: [1.0, 1.0, 1.0]
command_bias: [0.0, 0.0, 0.0]

# 扭矩限制
